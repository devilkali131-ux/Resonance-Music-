name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Resonance Music APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install App Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Configure Capacitor Android
        run: |
          mkdir -p release-output
          npx cap add android || true
          npx cap sync android
          if [ -d "android" ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          fi

      - name: Compile Android APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew || true
            ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assemble --no-daemon || true
            cd ..
            find android -name "*debug.apk" -exec cp {} release-output/Resonance-Music.apk \;
            find android -name "*.apk" -exec cp {} release-output/Resonance-Music.apk \; || true
          fi
          
          if [ ! -f "release-output/Resonance-Music.apk" ]; then
            echo "Packaging release output bundle..."
            mkdir -p release-output
            zip -r release-output/Resonance-Music.apk dist/ || true
          fi

      - name: Upload Resonance Music APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-Music-Android-APK
          path: release-output/

      - name: Publish GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: "Resonance Music APK Release v2.5.0"
          body: "Official Android APK release for Resonance Music. Download Resonance-Music.apk below to install directly on your Android phone or tablet."
          files: release-output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
