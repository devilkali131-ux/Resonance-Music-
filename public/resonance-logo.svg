<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="url(#cyanGlow)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="145" fill="url(#primaryGrad)" opacity="0.22" filter="url(#glow)" />

  <!-- Concentric Acoustic Resonance Rings -->
  <g opacity="0.45" stroke="url(#cyanGlow)" fill="none" stroke-width="3">
    <ellipse cx="256" cy="256" rx="190" ry="190" stroke-dasharray="12 16" />
    <ellipse cx="256" cy="256" rx="155" ry="155" stroke-dasharray="8 12" />
    <ellipse cx="256" cy="256" rx="120" ry="120" stroke-dasharray="6 8" />
  </g>

  <!-- Resonance Sound Wave & 'R' Harmonic Glyph -->
  <g filter="url(#glow)">
    <!-- Harmonic dynamic resonance waves -->
    <path d="M 150 256 C 180 180, 220 180, 256 256 C 292 332, 332 332, 362 256" fill="none" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 120 256 C 160 140, 210 140, 256 256 C 302 372, 352 372, 392 256" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    <path d="M 180 256 C 205 210, 230 210, 256 256 C 282 302, 307 302, 332 256" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" opacity="0.85" />

    <!-- Center Pulse Core -->
    <circle cx="256" cy="256" r="22" fill="#ffffff" />
    <circle cx="256" cy="256" r="14" fill="#00f0ff" />
    
    <!-- Resonance Frequency Sound Bars -->
    <rect x="206" y="226" width="8" height="60" rx="4" fill="#00f0ff" />
    <rect x="298" y="226" width="8" height="60" rx="4" fill="#ec4899" />
    <rect x="176" y="238" width="6" height="36" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="330" y="238" width="6" height="36" rx="3" fill="#f43f5e" opacity="0.9" />
  </g>
</svg>
